<svg lang="ar" xml:lang="ar" xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title description">
<title id="title">شهادة الخبرة في الخدمة - مشروع، غير الصادرة</title>
<desc id="description">نموذج تصميم شهادة GlobalPath Overseas. جميع خانات المشروع والولاية والعميل والتاريخ فارغة. لم يُقدَّم توقيع أو ختم أو اعتماد من الجهة المصدرة. هذه المسودة ليست دليلًا على أعمال منجزة.</desc>
<rect width="1120" height="790" fill="#f5f4ef"/>
<rect x="22" y="22" width="1076" height="746" fill="#fff" stroke="#d2b781"/>
<rect x="36" y="36" width="1048" height="142" fill="#102b3b"/>
<g transform="translate(68 69) scale(1.45)" fill="none" stroke="#d2b781" stroke-width="2.4">
<path d="M31.5 9.5C28.8 7.3 25.5 6 21.8 6C13.1 6 6 13.2 6 22S13.1 38 21.8 38C29.8 38 36.4 32 37.5 24.3"/>
