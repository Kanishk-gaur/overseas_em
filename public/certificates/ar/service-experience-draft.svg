</g>
<g font-family="Arial, Helvetica, sans-serif">
<text x="149" y="101" font-size="30" fill="#fff" font-weight="600">GlobalPath<tspan fill="#d2b781">.</tspan></text>
<text x="151" y="126" font-size="11" fill="#d2b781" letter-spacing="4">OVERSEAS</text>
<text x="1042" y="86"  font-size="12.00" letter-spacing="0" fill="#d2b781" direction="rtl" unicode-bidi="plaintext" text-anchor="start">شهادة التصميم</text>
<text x="1042" y="116"  font-size="16.00" fill="#fff" direction="rtl" unicode-bidi="plaintext" text-anchor="start">مسودة — غير صادرة</text>
<text x="1042" y="143"  font-size="11.00" fill="#dce1dd" direction="rtl" unicode-bidi="plaintext" text-anchor="start">تفاصيل المشروع و الموافقة على الإصدار</text>
<text x="1042" y="220" font-size="11.00" letter-spacing="0" fill="#84632f" direction="rtl" unicode-bidi="plaintext" text-anchor="start">سجل الخدمة</text>
</g>
<text x="1042" y="278" font-family="Georgia, 'Times New Roman', serif" font-size="48.00" fill="#102b3b" direction="rtl" unicode-bidi="plaintext" text-anchor="start">شهادة الخبرة الخدمة</text>
<path d="M78 302H1042" stroke="#dce1dd"/>
<path d="M78 302H181" stroke="#d2b781" stroke-width="3"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="548" y="336" font-size="10.00" fill="#586970" letter-spacing="0" direction="rtl" unicode-bidi="plaintext" text-anchor="start">شركة إسيو</text>
<text x="548" y="360" font-size="17.00" fill="#102b3b" direction="rtl" unicode-bidi="plaintext" text-anchor="start">[العميل / الشركة المعتمدة للإنتاج]</text>
<text x="1042" y="336" font-size="10.00" fill="#586970" letter-spacing="0" direction="rtl" unicode-bidi="plaintext" text-anchor="start">مشروع / ترتيب العمل</text>
<text x="1042" y="360" font-size="17.00" fill="#102b3b" direction="rtl" unicode-bidi="plaintext" text-anchor="start">[مراجعة مؤكدة ]</text>
<text x="1042" y="395" font-size="11.00" fill="#84632f" direction="rtl" unicode-bidi="plaintext" text-anchor="start">مشروع التصنيف للمراجعة الناشئة:</text>
<text x="1042" y="426" font-size="17.00" fill="#102b3b" direction="rtl" unicode-bidi="plaintext" text-anchor="start">[شركة إخراج] تؤكد أن [اسم المقاول القانوني]</text>
<text x="1042" y="453" font-size="17.00" fill="#102b3b" direction="rtl" unicode-bidi="plaintext" text-anchor="start">[الخدمات والمسؤوليات] في [موقع / مواقع في الهند] خلال</text>
<text x="1042" y="480" font-size="17.00" fill="#102b3b" direction="rtl" unicode-bidi="plaintext" text-anchor="start">[فترة الخدمة]، كما هو موضح في [مراجعة العقد / أمر العمل].</text>
<rect x="78" y="510" width="964" height="74" fill="#f5f4ef"/>
<text x="548" y="537" font-size="10.00" fill="#586970" letter-spacing="0" direction="rtl" unicode-bidi="plaintext" text-anchor="start">موقع العمل</text>
<text x="548" y="562" font-size="16.00" fill="#102b3b" direction="rtl" unicode-bidi="plaintext" text-anchor="start">[المدينة / المقاطعة ، ولاية ، الهند]</text>
<path d="M574 525V568" stroke="#dce1dd"/>
<text x="1027" y="537" font-size="10.00" fill="#586970" letter-spacing="0" direction="rtl" unicode-bidi="plaintext" text-anchor="start">فترة الخدمة</text>
<text x="1027" y="562" font-size="16.00" fill="#102b3b" direction="rtl" unicode-bidi="plaintext" text-anchor="start">[تاريخ البدء - تاريخ النهاية]</text>
<path d="M78 634H485M660 634H1042" stroke="#dce1dd"/>
<text x="548" y="657" font-size="11.00" fill="#586970" direction="rtl" unicode-bidi="plaintext" text-anchor="start">[الاسم المسموح به للتوقيع والتعيين]</text>
<text x="548" y="678" font-size="11.00" fill="#586970" direction="rtl" unicode-bidi="plaintext" text-anchor="start">التوقيع: غير متوفر</text>
<text x="1042" y="657" font-size="11.00" fill="#586970" direction="rtl" unicode-bidi="plaintext" text-anchor="start">[تاريخ الإصدار والاتصال المصدر للتحقق]</text>
<text x="1042" y="678" font-size="11.00" fill="#586970" direction="rtl" unicode-bidi="plaintext" text-anchor="start">موافقة المستشار: متوقفة</text>
<rect x="36" y="706" width="1048" height="48" fill="#102b3b"/>
<text x="368" y="735" font-size="11.00" fill="#d2b781" letter-spacing="0" direction="rtl" unicode-bidi="plaintext" text-anchor="start">نموذج غير صادر</text>
<text x="1042" y="735"  font-size="11.00" fill="#fff" direction="rtl" unicode-bidi="plaintext" text-anchor="start">لا دليل على الانتهاء من العمل.كل التفاصيل المكتوبة تتطلب تأكيد.</text>
</g>
