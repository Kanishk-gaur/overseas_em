<svg lang="he" xml:lang="he" xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title description">
<title id="title">תעודת ניסיון שירות – הצעת חוק, לא הוצגה</title>
<desc id="description">תבנית לעיצוב תעודה של GlobalPath Overseas. כל שדות הפרויקט, המדינה בהודו, הלקוח והתאריך ריקים. לא צורפו חתימה, חותמת או אישור של הגוף המנפיק. טיוטה זו אינה ראיה לעבודה שבוצעה.</desc>
<rect width="1120" height="790" fill="#f5f4ef"/>
<rect x="22" y="22" width="1076" height="746" fill="#fff" stroke="#d2b781"/>
<rect x="36" y="36" width="1048" height="142" fill="#102b3b"/>
<g transform="translate(68 69) scale(1.45)" fill="none" stroke="#d2b781" stroke-width="2.4">
<path d="M31.5 9.5C28.8 7.3 25.5 6 21.8 6C13.1 6 6 13.2 6 22S13.1 38 21.8 38C29.8 38 36.4 32 37.5 24.3"/>
<path d="M15.2 28.8L27.5 16.5H20.4M27.5 16.5V23.6M22 28H37.5V12.5M34 6H38"/>
</g>
<g font-family="Arial, Helvetica, sans-serif">
<text x="149" y="101" font-size="30" fill="#fff" font-weight="600">GlobalPath<tspan fill="#d2b781">.</tspan></text>
<text x="151" y="126" font-size="11" fill="#d2b781" letter-spacing="4">OVERSEAS</text>
<text x="1042" y="86"  font-size="12.00" letter-spacing="0" fill="#d2b781" direction="rtl" unicode-bidi="plaintext" text-anchor="start">עיצוב תעודת</text>
<text x="1042" y="116"  font-size="16.00" fill="#fff" direction="rtl" unicode-bidi="plaintext" text-anchor="start">טיוטה — לא הונפקה</text>
<text x="1042" y="143"  font-size="11.00" fill="#dce1dd" direction="rtl" unicode-bidi="plaintext" text-anchor="start">פרטים על פרויקטים וחיוב אישור</text>
<text x="1042" y="220" font-size="11.00" letter-spacing="0" fill="#84632f" direction="rtl" unicode-bidi="plaintext" text-anchor="start">רשומות שירות</text>
</g>
<text x="1042" y="278" font-family="Georgia, 'Times New Roman', serif" font-size="48.00" fill="#102b3b" direction="rtl" unicode-bidi="plaintext" text-anchor="start">תעודת ניסיון שירות</text>
<path d="M78 302H1042" stroke="#dce1dd"/>
<path d="M78 302H181" stroke="#d2b781" stroke-width="3"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="548" y="336" font-size="10.00" fill="#586970" letter-spacing="0" direction="rtl" unicode-bidi="plaintext" text-anchor="start">חברת יציאה</text>
<text x="548" y="360" font-size="17.00" fill="#102b3b" direction="rtl" unicode-bidi="plaintext" text-anchor="start">[הלקוח / חברת ההוצאה המוסמכת]</text>
<text x="1042" y="336" font-size="10.00" fill="#586970" letter-spacing="0" direction="rtl" unicode-bidi="plaintext" text-anchor="start">פרויקט / צו עבודה</text>
<text x="1042" y="360" font-size="17.00" fill="#102b3b" direction="rtl" unicode-bidi="plaintext" text-anchor="start">[התייחסות מאושרת]</text>
<text x="1042" y="395" font-size="11.00" fill="#84632f" direction="rtl" unicode-bidi="plaintext" text-anchor="start">הצעת חוק לביקורת של היוצר:</text>
<text x="1042" y="426" font-size="17.00" fill="#102b3b" direction="rtl" unicode-bidi="plaintext" text-anchor="start">[חברת ההוצאה לאור] מאשרת כי [שם משפטי של המעסיק] מספק</text>
<text x="1042" y="453" font-size="17.00" fill="#102b3b" direction="rtl" unicode-bidi="plaintext" text-anchor="start">[שירותים ואחריות] ב [מקום / מיקומים בהודו] במהלך</text>
<text x="1042" y="480" font-size="17.00" fill="#102b3b" direction="rtl" unicode-bidi="plaintext" text-anchor="start">[תקופת שירות], כפי שמתואר ב [הצגת חוזה / צו עבודה].</text>
<rect x="78" y="510" width="964" height="74" fill="#f5f4ef"/>
<text x="548" y="537" font-size="10.00" fill="#586970" letter-spacing="0" direction="rtl" unicode-bidi="plaintext" text-anchor="start">מיקום העבודה</text>
<text x="548" y="562" font-size="16.00" fill="#102b3b" direction="rtl" unicode-bidi="plaintext" text-anchor="start">[עיר / מחוז, מדינה, הודו]</text>
<path d="M574 525V568" stroke="#dce1dd"/>
<text x="1027" y="537" font-size="10.00" fill="#586970" letter-spacing="0" direction="rtl" unicode-bidi="plaintext" text-anchor="start">תקופת השירות</text>
<text x="1027" y="562" font-size="16.00" fill="#102b3b" direction="rtl" unicode-bidi="plaintext" text-anchor="start">[התחלה – תאריך סיום]</text>
<path d="M78 634H485M660 634H1042" stroke="#dce1dd"/>
<text x="548" y="657" font-size="11.00" fill="#586970" direction="rtl" unicode-bidi="plaintext" text-anchor="start">[שם חתימה מורשה וסימן]</text>
<text x="548" y="678" font-size="11.00" fill="#586970" direction="rtl" unicode-bidi="plaintext" text-anchor="start">חתימה: לא מסופק</text>
<text x="1042" y="657" font-size="11.00" fill="#586970" direction="rtl" unicode-bidi="plaintext" text-anchor="start">[תאריך ההוצאה והקשר של היוצר כדי לבדוק]</text>
<text x="1042" y="678" font-size="11.00" fill="#586970" direction="rtl" unicode-bidi="plaintext" text-anchor="start">אישור: צפוי</text>
<rect x="36" y="706" width="1048" height="48" fill="#102b3b"/>
<text x="368" y="735" font-size="11.00" fill="#d2b781" letter-spacing="0" direction="rtl" unicode-bidi="plaintext" text-anchor="start">תבנית שלא הונפקה</text>
<text x="1042" y="735"  font-size="11.00" fill="#fff" direction="rtl" unicode-bidi="plaintext" text-anchor="start">אין הוכחה של עבודה מושלמת.כל הפרטים המפורטים דורשים אישור.</text>
</g>
</svg>

