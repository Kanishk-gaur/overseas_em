<svg lang="ro" xml:lang="ro" xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title description">
<title id="title">Certificat de completare a lucrărilor. Proiect, neeliberat</title>
<desc id="description">Modelul de proiectare a certificatului GlobalPath Overseas. Toate câmpurile de proiect, de stat, client și data sunt deţinători de locuri goale. Nu a fost furnizată nici o semnătură, sigiliu sau aprobare a emitentului. Acest proiect nu este dovada de lucru finalizat.</desc>
