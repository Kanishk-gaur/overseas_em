<text x="1043" y="116" text-anchor="end" font-size="16.00" fill="#fff">PROJEKT — NIE WYDANO</text>
<text x="1043" y="143" text-anchor="end" font-size="11.00" fill="#dce1dd">Szczegóły projektu i zatwierdzenie emitenta wciąż w trakcie</text>
<text x="78" y="220" font-size="11.00" letter-spacing="0" fill="#84632f">Rekordy serwisowe</text>
