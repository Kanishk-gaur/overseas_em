<g font-family="Arial, Helvetica, sans-serif">
<text x="78" y="336" font-size="10.00" fill="#586970" letter-spacing="0">Wywołująca firma</text>
<text x="78" y="360" font-size="17.00" fill="#102b3b">[Client / upoważniona firma wydająca]</text>
<text x="660" y="336" font-size="10.00" fill="#586970" letter-spacing="0">Projekt / porządek pracy referencyjny</text>
<text x="660" y="360" font-size="17.00" fill="#102b3b">[Zgodne z potwierdzeniem odniesienia]</text>
<text x="78" y="395" font-size="11.00" fill="#84632f">Projekt tekstów dla audycji emitenta:</text>
<text x="78" y="426" font-size="17.00" fill="#102b3b">[Sprawa wycofania] potwierdza, że [nazwa prawna wykonawcy]</text>
<text x="78" y="453" font-size="17.00" fill="#102b3b">[Służby i obowiązki] w [Site / lokalizacje w Indiach] w czasie</text>
<text x="78" y="480" font-size="17.00" fill="#102b3b">[Przez okres usług], jak to jest udokumentowane w [porządek umowy / porządek pracy odniesienia].</text>
<rect x="78" y="510" width="964" height="74" fill="#f5f4ef"/>
