<svg lang="ru" xml:lang="ru" xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title description">
<title id="title">Сертификат об опыте службы — проект, не выданный</title>
<desc id="description">Шаблон оформления сертификата GlobalPath Overseas. Все поля проекта, штата Индии, клиента и даты оставлены пустыми. Подпись, печать и одобрение выдающей стороны отсутствуют. Этот черновик не подтверждает выполненную работу.</desc>
