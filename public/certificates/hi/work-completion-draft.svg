<svg lang="hi" xml:lang="hi" xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title description">
<title id="title">कार्य पूर्णता प्रमाणपत्र — ड्राफ्ट, पर जारी नहीं</title>
<desc id="description">वैश्विक पथ प्रमाणपत्रों पर डिजाइन किए गए टैम्प्लेट. सभी परियोजना, राज्य, क्लाएंट और तारीख फ़ील्ड रिक्त हैं. कोई हस्ताक्षर, मुहर या निर्गमक अनुमोदन प्रदान नहीं किया गया है. यह ड्राफ्ट पूरा काम का सबूत नहीं है.</desc>
<rect width="1120" height="790" fill="#f5f4ef"/>
<rect x="22" y="22" width="1076" height="746" fill="#fff" stroke="#d2b781"/>
<rect x="36" y="36" width="1048" height="142" fill="#102b3b"/>
<g transform="translate(68 69) scale(1.45)" fill="none" stroke="#d2b781" stroke-width="2.4">
<path d="M31.5 9.5C28.8 7.3 25.5 6 21.8 6C13.1 6 6 13.2 6 22S13.1 38 21.8 38C29.8 38 36.4 32 37.5 24.3"/>
<path d="M15.2 28.8L27.5 16.5H20.4M27.5 16.5V23.6M22 28H37.5V12.5M34 6H38"/>
</g>
<g font-family="Arial, Helvetica, sans-serif">
<text x="149" y="101" font-size="30" fill="#fff" font-weight="600">GlobalPath<tspan fill="#d2b781">.</tspan></text>
<text x="151" y="126" font-size="11" fill="#d2b781" letter-spacing="4">OVERSEAS</text>
<text x="1043" y="86" text-anchor="end" font-size="12.00" letter-spacing="0" fill="#d2b781">प्रमाणपत्र प्रारूप</text>
<text x="1043" y="116" text-anchor="end" font-size="16.00" fill="#fff">प्रारूप — जारी नहीं</text>
<text x="1043" y="143" text-anchor="end" font-size="11.00" fill="#dce1dd">परियोजना विवरण व जारीकर्ता अनुमोदन स्थगित</text>
<text x="78" y="220" font-size="11.00" letter-spacing="0" fill="#84632f">सदस्यीय</text>
</g>
<text x="76" y="278" font-family="Georgia, 'Times New Roman', serif" font-size="48.00" fill="#102b3b">कार्य पूर्णता प्रमाणपत्र</text>
<path d="M78 302H1042" stroke="#dce1dd"/>
<path d="M78 302H181" stroke="#d2b781" stroke-width="3"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="78" y="336" font-size="10.00" fill="#586970" letter-spacing="0">इमानिकी</text>
<text x="78" y="360" font-size="17.00" fill="#102b3b">[CACACAN / प्राधिकृत कंपनी का निर्माण]</text>
<text x="660" y="336" font-size="10.00" fill="#586970" letter-spacing="0">मसीही जीवन और गुण</text>
<text x="660" y="360" font-size="17.00" fill="#102b3b">[पुष्टि के संदर्भ]</text>
<text x="78" y="395" font-size="11.00" fill="#84632f">निर्गमक की समीक्षा के लिए ड्राफ्ट शब्द:</text>
<text x="78" y="426" font-size="17.00" fill="#102b3b">[ववरी कंपनी] पुष्टि करता है कि [क कानूनी नाम] पूरा हुआ</text>
<text x="78" y="453" font-size="17.00" fill="#102b3b">[ पेज 27 पर तसवीर]</text>
<text x="78" y="480" font-size="17.00" fill="#102b3b">समाप्ति की तिथि और कोई भी स्थिति: [इस परियोजना के रिकार्ड से विस्तार से विस्तार ।</text>
<rect x="78" y="510" width="964" height="74" fill="#f5f4ef"/>
<text x="98" y="537" font-size="10.00" fill="#586970" letter-spacing="0">काम करते हैं</text>
<text x="98" y="562" font-size="16.00" fill="#102b3b">[शहर / ज़िला, भारत]</text>
<path d="M574 525V568" stroke="#dce1dd"/>
<text x="597" y="537" font-size="10.00" fill="#586970" letter-spacing="0">क्रिया तिथि</text>
<text x="597" y="562" font-size="16.00" fill="#102b3b">[DDDL माह YY]</text>
<path d="M78 634H485M660 634H1042" stroke="#dce1dd"/>
<text x="78" y="657" font-size="11.00" fill="#586970">[प्रसार्ड साइनेड एक्स- शीर्षक]</text>
<text x="78" y="678" font-size="11.00" fill="#586970">हस्ताक्षर:</text>
<text x="660" y="657" font-size="11.00" fill="#586970">[हैज़ल्ड तिथि व प्राधिकृत संपर्क]</text>
<text x="660" y="678" font-size="11.00" fill="#586970">निर्गमक अनुमोदन: स्थगित</text>
<rect x="36" y="706" width="1048" height="48" fill="#102b3b"/>
<text x="78" y="735" font-size="11.00" fill="#d2b781" letter-spacing="0">जारी नहीं किया गया प्रारूप</text>
<text x="1042" y="735" text-anchor="end" font-size="11.00" fill="#fff">पूरा काम पूरा करने के सबूत नहीं हैं ।</text>
</g>
</svg>

