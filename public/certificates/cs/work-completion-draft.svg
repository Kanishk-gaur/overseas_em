<svg lang="cs" xml:lang="cs" xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title description">
<title id="title">Certifikát dokončení práce. Návrh, nevydán</title>
<desc id="description">Návrhové schéma certifikátu GlobalPath Overseas. Všechny projekty, stav, klient a data jsou prázdné. Nebyla předložena žádná podpisová, pečeť nebo schválení emitenta. Tento návrh není důkazem o dokončené práci.</desc>
